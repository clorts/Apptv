name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q tv-launcher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
        working-directory: tv-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: meu-sistema-tv
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
